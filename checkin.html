<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Check-in - SAMURAI HOUSE NAKASENDO</title>
<style>
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",Roboto,sans-serif; background:#F7F6F2; color:#2C2C2A; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
#app { width:100%; max-width:420px; }
.brand { text-align:center; font-size:12px; letter-spacing:0.12em; color:#8A8880; margin-bottom:14px; }
.card { background:#fff; border:0.5px solid #E3E1D9; border-radius:16px; padding:28px 24px; }
.progress { display:flex; gap:4px; margin-bottom:24px; }
.bar { flex:1; height:3px; border-radius:2px; background:#E3E1D9; }
.bar.done { background:#2C2C2A; }
.step-count { font-size:13px; color:#8A8880; margin:0 0 4px; }
h1 { font-size:20px; font-weight:600; margin:0 0 4px; }
.jp { font-size:14px; color:#8A8880; margin:0 0 4px; }
.hint { font-size:13px; color:#6B6A64; margin:0 0 16px; line-height:1.5; }
input[type="text"] { width:100%; font-size:16px; padding:12px 14px; border:1px solid #D8D6CC; border-radius:10px; font-family:inherit; background:#FBFAF7; }
input[type="text"]:focus { outline:none; border-color:#2C2C2A; }
input[type="file"] { width:100%; font-size:14px; }
.field-label { font-size:13px; color:#8A8880; margin:0 0 4px; }
.field-group { margin-bottom:14px; }
.choice { display:block; width:100%; text-align:left; font-size:16px; padding:14px 16px; border:1px solid #D8D6CC; border-radius:10px; background:#FBFAF7; margin-bottom:10px; cursor:pointer; font-family:inherit; color:inherit; }
.choice.selected { border-color:#2C2C2A; background:#2C2C2A; color:#fff; }
.choice small { display:block; font-size:13px; opacity:0.7; margin-top:2px; }
.counter { display:flex; align-items:center; justify-content:center; gap:24px; margin:8px 0 4px; }
.counter button { width:52px; height:52px; font-size:24px; border-radius:26px; border:1px solid #D8D6CC; background:#FBFAF7; cursor:pointer; font-family:inherit; color:inherit; line-height:1; }
.counter button:disabled { opacity:0.35; }
.counter .num { font-size:34px; font-weight:600; min-width:52px; text-align:center; }
.error { font-size:13px; color:#A32D2D; margin:8px 0 0; display:none; }
.btn-row { display:flex; gap:8px; margin-top:24px; }
button.nav { font-size:15px; padding:12px; border-radius:10px; border:1px solid #D8D6CC; background:#fff; cursor:pointer; font-family:inherit; color:inherit; }
button#next { flex:2; background:#2C2C2A; color:#fff; border-color:#2C2C2A; }
button#next:disabled { opacity:0.55; }
button#back { flex:1; }
.photo-status { font-size:13px; margin-top:8px; color:#6B6A64; }
img.preview { margin-top:8px; max-width:100%; border-radius:10px; border:1px solid #E3E1D9; }
.done-screen { text-align:center; padding:24px 0; }
.done-screen h2 { font-size:20px; margin:12px 0 4px; }
.done-screen p { font-size:14px; color:#6B6A64; margin:0; line-height:1.6; }
.tick { font-size:34px; color:#3B6D11; line-height:1; }
</style>
</head>
<body>
<div id="app">
<p class="brand">SAMURAI HOUSE NAKASENDO</p>
<div class="card" id="card"></div>
</div>
<script>
var ENDPOINT = "https://script.google.com/macros/s/AKfycbyYaGzOC_iDelPo-mfS6Y9PM9Izyvc2fKuKsAuidptlvuWs26Yw8VPrO3nyidmLXqzg/exec";
var data = { japanese:null, count:1, names:[''], passport:'', photo:'' };
var idx = 0;
var card = document.getElementById('card');

function steps(){ var l=['japanese','count','names']; if(data.japanese==='no'){l.push('passport','photo');} return l; }

function compressImage(file,maxW){
  return new Promise(function(resolve,reject){
    var img=new Image(), reader=new FileReader();
    reader.onload=function(){img.src=reader.result;};
    reader.onerror=reject;
    img.onload=function(){
      var s=Math.min(1,maxW/img.width), w=Math.round(img.width*s), h=Math.round(img.height*s);
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',0.7));
    };
    img.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function syncNames(){ while(data.names.length<data.count) data.names.push(''); data.names.length=data.count; }

function head(t,j,h){
  var l=steps();
  return '<div class="progress">'+l.map(function(_,i){return '<div class="bar'+(i<=idx?' done':'')+'"></div>';}).join('')+'</div>'+
    '<p class="step-count">'+(idx+1)+' / '+l.length+'</p><h1>'+t+'</h1><p class="jp">'+j+'</p>'+
    (h?'<p class="hint">'+h+'</p>':'<div style="margin-bottom:16px;"></div>');
}

function footer(last){
  return '<p class="error" id="err"></p><div class="btn-row">'+
    (idx>0?'<button class="nav" id="back">Back</button>':'')+
    '<button class="nav" id="next">'+(last?'Submit':'Next')+'</button></div>';
}

function showErr(m){ var e=document.getElementById('err'); e.textContent=m; e.style.display='block'; }

function render(){
  var l=steps();
  if(idx>=l.length) idx=l.length-1;
  var step=l[idx], last=idx===l.length-1, body='';

  if(step==='japanese'){
    body=head('Are you a Japanese national?','日本国籍ですか？','Japanese nationals do not need to provide passport details.')+
      '<button type="button" class="choice'+(data.japanese==='yes'?' selected':'')+'" data-v="yes">Yes<small>はい</small></button>'+
      '<button type="button" class="choice'+(data.japanese==='no'?' selected':'')+'" data-v="no">No<small>いいえ</small></button>';
  } else if(step==='count'){
    body=head('How many guests in total?','宿泊人数（合計）','Including yourself.')+
      '<div class="counter"><button type="button" id="minus"'+(data.count<=1?' disabled':'')+'>&minus;</button><span class="num">'+data.count+'</span><button type="button" id="plus"'+(data.count>=10?' disabled':'')+'>+</button></div>';
  } else if(step==='names'){
    syncNames();
    var f='';
    for(var i=0;i<data.count;i++){
      f+='<div class="field-group"><p class="field-label">'+(i===0?'Guest 1 (you) / 代表者':'Guest '+(i+1)+' / 同行者')+'</p><input type="text" class="nameField" data-i="'+i+'" placeholder="Full name" value="'+(data.names[i]||'')+'" /></div>';
    }
    body=head('Names of all guests','宿泊者全員のお名前','Please enter each name as it appears on ID.')+f;
  } else if(step==='passport'){
    body=head('Passport number','パスポート番号','Required by Japanese law for guests from outside Japan.')+
      '<input id="field" type="text" placeholder="e.g. AB1234567" value="'+(data.passport||'')+'" />';
  } else if(step==='photo'){
    body=head('Passport photo','パスポート写真','Take a photo of the page with your name and photo.')+
      '<input id="field" type="file" accept="image/*" /><p class="photo-status" id="photoStatus">'+(data.photo?'Photo added':'')+'</p>'+
      (data.photo?'<img class="preview" src="'+data.photo+'" />':'');
  }

  card.innerHTML=body+footer(last);

  if(step==='japanese'){
    Array.prototype.forEach.call(card.querySelectorAll('.choice'),function(b){
      b.onclick=function(){ data.japanese=b.getAttribute('data-v'); idx++; render(); };
    });
  }
  if(step==='count'){
    document.getElementById('minus').onclick=function(){ if(data.count>1){data.count--; syncNames(); render();} };
    document.getElementById('plus').onclick=function(){ if(data.count<10){data.count++; syncNames(); render();} };
  }
  if(step==='names'){
    Array.prototype.forEach.call(card.querySelectorAll('.nameField'),function(f){
      f.oninput=function(){ data.names[parseInt(f.getAttribute('data-i'),10)]=f.value; };
    });
  }
  if(step==='photo'){
    document.getElementById('field').onchange=function(e){
      var file=e.target.files[0];
      if(!file) return;
      document.getElementById('photoStatus').textContent='Processing...';
      compressImage(file,1000).then(function(d){ data.photo=d; render(); }).catch(function(){ showErr('Could not read that image.'); });
    };
  }

  document.getElementById('next').onclick=function(){
    var btn=document.getElementById('next');
    document.getElementById('err').style.display='none';
    if(step==='japanese'&&!data.japanese){ showErr('Please choose one.'); return; }
    if(step==='names'){
      for(var i=0;i<data.count;i++){
        if(!data.names[i]||!data.names[i].trim()){ showErr('Please enter all guest names.'); return; }
      }
    }
    if(step==='passport'){
      var v=document.getElementById('field').value.trim();
      if(!v){ showErr('Please fill this in.'); return; }
      data.passport=v;
    }
    if(last){ btn.textContent='Sending...'; btn.disabled=true; submit(); }
    else { idx++; render(); }
  };

  if(idx>0){
    document.getElementById('back').onclick=function(){
      if(step==='passport') data.passport=document.getElementById('field').value;
      idx--; render();
    };
  }
}

function submit(){
  var payload={
    name:(data.names[0]||'').trim(),
    nationality:data.japanese==='yes'?'日本':'外国籍',
    passport:data.passport||'',
    photo:data.photo||'',
    companions:data.names.slice(1).filter(function(n){return n&&n.trim();}).join(', '),
    count:data.count
  };
  fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
  .then(function(){
    card.innerHTML='<div class="done-screen"><div class="tick">&#10003;</div><h2>Thank you!</h2><p>We have received your details.<br>ご協力ありがとうございました。<br><br>See you soon at SAMURAI HOUSE.</p></div>';
  })
  .catch(function(){
    card.innerHTML='<div class="done-screen"><p style="color:#A32D2D;">Could not send. Please check your connection and try again.<br>送信できませんでした。</p><div class="btn-row"><button class="nav" id="retry" style="flex:1;">Retry</button></div></div>';
    document.getElementById('retry').onclick=function(){ submit(); };
  });
}

render();
</script>
</body>
</html>
